<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>善迹 Logo · 静态笔迹定稿</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #070a0f; color: #e8eef4;
    font-family: "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 48px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
  p { margin: 0; opacity: .55; font-size: .86rem; line-height: 1.55; }
  .panel {
    border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.06);
    /* 透明底预览棋盘 */
    background-color: #10161c;
    background-image:
      linear-gradient(45deg, #182028 25%, transparent 25%),
      linear-gradient(-45deg, #182028 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #182028 75%),
      linear-gradient(-45deg, transparent 75%, #182028 75%);
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0;
  }
  .panel.black { background: #000; background-image: none; }
  .panel img, .panel object, .panel svg { display: block; width: 100%; height: auto; }
  .row { display: grid; gap: 14px; }
  @media (min-width: 800px) { .row { grid-template-columns: 1fr 1fr; } }
  .label { padding: 10px 14px; font-size: .75rem; opacity: .45; border-bottom: 1px solid rgba(255,255,255,.05); }
  a { color: #8be0c4; }
  code { font-size: .8rem; opacity: .75; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>善迹 · 艺术手写 Logo 静态定稿</h1>
    <p>
      行书手写体「善迹」/ 香槟金奶油白 / 透明背景。静态 SVG 为品牌定稿；书写动画复用同一字轮廓 + hello 光尖轨迹。
      源文件：<code>brand/shanji-logo.svg</code> · 路径数据：<code>brand/shanji-paths.js</code>
    </p>

    <div class="row">
      <div>
        <div class="panel">
          <div class="label">透明底预览（棋盘格）</div>
          <img src="./shanji-logo.svg" alt="善迹 Logo" />
        </div>
      </div>
      <div>
        <div class="panel black">
          <div class="label">纯黑底预览（接近开机画面）</div>
          <img src="./shanji-logo.svg" alt="善迹 Logo on black" />
        </div>
      </div>
    </div>

    <p>
      书写动画预览：
      <a href="../effects/shanji-calligraphy.html">effects/shanji-calligraphy.html</a>
      （使用同一主路径做写画）
    </p>
  </div>
</body>
</html>
