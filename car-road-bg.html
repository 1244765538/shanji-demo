<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公路 · 网页背景动画</title>
<style>
  :root { --aspect: 2 / 1; }        /* 宽 / 高 = 2/1（横版） */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: block;
    background: #070a19;
    overflow: hidden;
  }
  /* iframe / 嵌入：舞台铺满父容器（父级已约束 2:1） */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: none;
    aspect-ratio: auto;
    overflow: hidden;
    box-shadow: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="stage"><canvas id="scene"></canvas></div>
<script>
(function () {
  'use strict';

  /* ==================== 可调参数 ==================== */
  const ASPECT = 2;          // 宽 / 高 = 2/1（横版）
  const H      = 1200;       // 设计稿高度
  const W      = H * ASPECT; // 设计稿宽度

  const SKY_END   = 0.625;   // 天空（含云）：3/4 收成 5/8，给加高的山让地方
  const MTN_END   = 0.875;   // 山占 1/4，最下面 1/8 是公路
  const CLOUD_TOP = 0.125;   // 云只出现在最上方 1/8
  const DUSK_END  = 0.25;    // 顶部 1/4：傍晚 → 夜晚

  const SPEED = 210;         // 公路 / 白线后退速度（设计像素 / 秒）

  /* ==================== 基础 ==================== */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const HAS_FILTER = 'filter' in ctx;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ySky = H * SKY_END;  // 900
  const yMtn = H * MTN_END;  // 1050
  const mtnH = yMtn - ySky;  // 150

  let scale = 1;
  let t = 0;
  let pulse = 0;             // 双击小车时的反馈（0→1 衰减）

  /* ==================== 小工具 ==================== */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let v = Math.imul(a ^ (a >>> 15), 1 | a);
      v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
      return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 两个十六进制颜色按 t 混合
  function mixColor(a, b, t) {
    const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    return 'rgb(' + Math.round(ar + (br - ar) * t) + ',' +
                    Math.round(ag + (bg - ag) * t) + ',' +
                    Math.round(ab + (bb - ab) * t) + ')';
  }

  /* 圆润山脊：若干“升余弦”鼓包叠加，周期 1，可无缝平铺 */
  function makeRidge(seed, count, hMin) {
    const rnd = mulberry32(seed);
    const bumps = [];
    for (let i = 0; i < count; i++) {
      bumps.push({
        c: rnd(),
        w: 0.10 + rnd() * 0.12,   // 半宽
        a: 0.55 + rnd() * 0.45    // 高度权重
      });
    }
    const raw = function (u) {
      let s = 0;
      for (let i = 0; i < bumps.length; i++) {
        const b = bumps[i];
        for (let k = -1; k <= 1; k++) {
          const d = Math.abs(u - b.c - k);
          if (d < b.w) {
            const x = 0.5 + 0.5 * Math.cos(Math.PI * d / b.w);
            s += b.a * x * x;
          }
        }
      }
      return s;
    };
    let mx = 0;
    for (let i = 0; i <= 400; i++) {
      const v = raw(i / 400);
      if (v > mx) mx = v;
    }
    mx = mx || 1;
    return function (u) { return hMin + (1 - hMin) * (raw(u) / mx); };
  }

  /* ==================== 出片后处理 ==================== */
  // 噪点贴图：暗点 + 亮点，平铺使用（胶片颗粒 / 沥青颗粒共用一套生成器）
  function makeNoiseTile(size, seed, darkP, lightP, aMax) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const img = g.createImageData(size, size);
    const d = img.data;
    const rnd = mulberry32(seed);
    for (let i = 0; i < d.length; i += 4) {
      const v = rnd();
      if (v < darkP) {
        d[i + 3] = 22 + rnd() * aMax;                 // 黑点
      } else if (v > 1 - lightP) {
        d[i] = d[i + 1] = d[i + 2] = 255;             // 白点
        d[i + 3] = 16 + rnd() * aMax * 0.8;
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  // 沥青：大小不一的砂粒，带明暗两面（边界处做环绕，平铺无缝）
  function makeAsphaltTile(size, seed) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const rnd = mulberry32(seed);
    for (let i = 0; i < 520; i++) {
      const x = rnd() * size, y = rnd() * size, r = 0.5 + rnd() * 1.7;
      g.fillStyle = rnd() < 0.62
        ? 'rgba(16,16,18,' + (0.20 + rnd() * 0.45).toFixed(3) + ')'
        : 'rgba(230,230,236,' + (0.10 + rnd() * 0.22).toFixed(3) + ')';
      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          g.beginPath();
          g.arc(x + ox * size, y + oy * size, r, 0, Math.PI * 2);
          g.fill();
        }
      }
    }
    return c;
  }

  const grainTile = makeNoiseTile(256, 991, 0.30, 0.26, 42);
  const asphaltTile = makeAsphaltTile(200, 4421);

  let gradTemp = null, gradVig = null;

  // 整张画面的统一调色：色温过渡 + 暗角 + 胶片颗粒
  function post() {
    if (!gradTemp) {
      gradTemp = ctx.createLinearGradient(0, 0, 0, H);
      gradTemp.addColorStop(0.00, 'rgba(58, 92, 176, 0.95)');   // 天顶偏冷
      gradTemp.addColorStop(0.30, 'rgba(112, 104, 186, 0.55)');
      gradTemp.addColorStop(0.56, 'rgba(255, 156, 78, 0.42)');   // 地平线回暖
      gradTemp.addColorStop(0.80, 'rgba(255, 198, 136, 0.24)');
      gradTemp.addColorStop(1.00, 'rgba(38, 32, 68, 0.60)');     // 地面收一点冷
    }
    // 1) 色温
    ctx.save();
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = 0.34;
    ctx.fillStyle = gradTemp;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 2) 暗角
    if (!gradVig) {
      gradVig = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.30,
                                         W * 0.5, H * 0.52, W * 0.76);
      gradVig.addColorStop(0.00, 'rgba(0,0,0,0)');
      gradVig.addColorStop(0.58, 'rgba(6,8,18,0.10)');
      gradVig.addColorStop(0.82, 'rgba(4,6,14,0.24)');
      gradVig.addColorStop(1.00, 'rgba(2,3,10,0.46)');
    }
    ctx.fillStyle = gradVig;
    ctx.fillRect(0, 0, W, H);

    // 3) 胶片颗粒（按设备像素铺，避免被缩放糊掉）
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.032;
    const cw = canvas.width, ch = canvas.height;
    const gx = reduced ? 0 : (t * 41) % 256;
    const gy = reduced ? 0 : (t * 67) % 256;
    for (let y = -gy; y < ch; y += 256) {
      for (let x = -gx; x < cw; x += 256) {
        ctx.drawImage(grainTile, Math.round(x), Math.round(y));
      }
    }
    ctx.restore();
  }

  /* ==================== 天空 ==================== */
  const SUN_X = W * 0.665;           // 低悬的太阳
  const SUN_Y = ySky - H * 0.052;

  // 星星：只落在顶部那段夜色里，越往下越淡
  const STARS = (function () {
    const rnd = mulberry32(7731);
    const out = [];
    for (let i = 0; i < 96; i++) {
      out.push({
        x: rnd() * W,
        y: rnd() * H * 0.24,
        a: 0.10 + rnd() * 0.40,
        r: 0.7 + rnd() * 1.6,
        ph: rnd() * Math.PI * 2
      });
    }
    return out;
  })();

  function drawStars() {
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const tw = reduced ? 1 : 0.72 + 0.28 * Math.sin(t * 0.9 + s.ph);
      const fade = 1 - Math.max(0, Math.min(1, (s.y - H * 0.07) / (H * 0.17)));
      const a = s.a * tw * (0.30 + 0.70 * fade);
      if (a <= 0.012) continue;
      ctx.fillStyle = 'rgba(228,236,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 2~3 层雾带：贴着地平线慢慢横向漂移
  const FOG_BANDS = [
    { y: ySky - H * 0.088, h: H * 0.017, a: 0.07, sp: 0.050, ph: 0.0 },
    { y: ySky - H * 0.052, h: H * 0.014, a: 0.09, sp: -0.035, ph: 2.1 },
    { y: ySky - H * 0.018, h: H * 0.011, a: 0.11, sp: 0.070, ph: 4.2 }
  ];

  function drawFog() {
    for (let i = 0; i < FOG_BANDS.length; i++) {
      const b = FOG_BANDS[i];
      const cx = W / 2 + Math.sin(t * b.sp + b.ph) * W * 0.12;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.translate(cx, b.y);
      ctx.scale(1, b.h / (W * 0.45));
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.45);
      rg.addColorStop(0.00, 'rgba(255, 214, 170,' + b.a.toFixed(3) + ')');
      rg.addColorStop(0.50, 'rgba(255, 186, 136,' + (b.a * 0.40).toFixed(3) + ')');
      rg.addColorStop(1.00, 'rgba(255, 170, 120, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(0, 0, W * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawSky() {
    // 天空一直铺到山脚；画得比画面大很多，转场整体旋转时四角也不会露底
    // 一条完整的黄昏渐变：夜蓝 → 紫 → 焦橙 → 地平线的暖金（保留暖调）
    const g = ctx.createLinearGradient(0, 0, 0, ySky);
    g.addColorStop(0.000, '#050818');
    g.addColorStop(0.055, '#080D24');
    g.addColorStop(0.125, '#0E1433');
    g.addColorStop(0.195, '#1A1B45');
    g.addColorStop(0.265, '#2B2155');
    g.addColorStop(0.335, '#452A57');
    g.addColorStop(0.410, '#66344F');
    g.addColorStop(0.485, '#8C403F');
    g.addColorStop(0.560, '#B34E2B');
    g.addColorStop(0.645, '#D66A1D');
    g.addColorStop(0.735, '#EE8A1E');
    g.addColorStop(0.835, '#F89A2C');
    g.addColorStop(0.925, '#FFAD4E');
    g.addColorStop(1.000, '#FFC069');
    ctx.fillStyle = g;
    ctx.fillRect(-W, -H, W * 3, yMtn + H + 2);

    // 星
    drawStars();

    // 低悬的太阳：大团暖光晕 + 贴地光带 + 亮核（随后被山挡住，只露一圈边）
    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    const s = ctx.createRadialGradient(SUN_X, SUN_Y, 0, SUN_X, SUN_Y, W * 0.44);
    s.addColorStop(0.000, 'rgba(255, 244, 212, 0.88)');
    s.addColorStop(0.040, 'rgba(255, 216, 152, 0.52)');
    s.addColorStop(0.130, 'rgba(255, 178, 98, 0.24)');
    s.addColorStop(0.340, 'rgba(255, 140, 58, 0.10)');
    s.addColorStop(0.660, 'rgba(255, 112, 36, 0.03)');
    s.addColorStop(1.000, 'rgba(255, 100, 30, 0)');
    ctx.fillStyle = s;
    ctx.fillRect(-W, -H, W * 3, yMtn + H + 2);

    // 山脊背后的一束淡逆光（很轻的几道光柱）
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 0.30 + Math.sin(t * 0.09 + i * 1.7) * 0.03;
      const len = H * 0.58;
      const spread = 0.075 + i * 0.02;
      const sg = ctx.createLinearGradient(SUN_X, SUN_Y,
                                          SUN_X + Math.cos(a) * len,
                                          SUN_Y + Math.sin(a) * len);
      sg.addColorStop(0.00, 'rgba(255, 226, 172, 0.045)');
      sg.addColorStop(0.45, 'rgba(255, 210, 152, 0.022)');
      sg.addColorStop(1.00, 'rgba(255, 196, 140, 0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(SUN_X, SUN_Y);
      ctx.lineTo(SUN_X + Math.cos(a - spread) * len, SUN_Y + Math.sin(a - spread) * len);
      ctx.lineTo(SUN_X + Math.cos(a + spread) * len, SUN_Y + Math.sin(a + spread) * len);
      ctx.closePath();
      ctx.fill();
    }

    const b = ctx.createLinearGradient(0, ySky - H * 0.20, 0, ySky + H * 0.05);
    b.addColorStop(0.00, 'rgba(255, 196, 120, 0)');
    b.addColorStop(0.64, 'rgba(255, 206, 140, 0.06)');
    b.addColorStop(0.87, 'rgba(255, 230, 182, 0.11)');
    b.addColorStop(1.00, 'rgba(255, 210, 150, 0)');
    ctx.fillStyle = b;
    ctx.fillRect(-W, ySky - H * 0.22, W * 3, H * 0.30);
    ctx.restore();

    // 雾带
    drawFog();

    // 太阳本体
    const d = ctx.createRadialGradient(SUN_X, SUN_Y, 0, SUN_X, SUN_Y, H * 0.082);
    d.addColorStop(0.00, 'rgba(255, 252, 242, 1.00)');
    d.addColorStop(0.38, 'rgba(255, 238, 196, 0.95)');
    d.addColorStop(0.72, 'rgba(255, 208, 142, 0.55)');
    d.addColorStop(1.00, 'rgba(255, 198, 124, 0)');
    ctx.fillStyle = d;
    ctx.beginPath();
    ctx.arc(SUN_X, SUN_Y, H * 0.082, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ==================== 云 ==================== */
  const CLOUD_BASE = H * CLOUD_TOP * 2.0;
  const CLOUD_COUNT = Math.max(3, Math.min(8, Math.round(W / 320)));
  const clouds = [];
  (function initClouds() {
    const rnd = mulberry32(20261104);
    for (let i = 0; i < CLOUD_COUNT; i++) {
      const s = 0.50 + rnd() * 0.35;
      const w = CLOUD_BASE * s;
      const h = w * 0.42;
      const maxY = Math.max(4, CLOUD_TOP * H - h - 10);
      clouds.push({
        x0: (i / CLOUD_COUNT) * W + rnd() * (W / CLOUD_COUNT) * 0.6,
        y: 8 + rnd() * maxY,
        w: w,
        h: h,
        spd: 34 + rnd() * 26,                 // 横向飘移速度
        ph: rnd() * Math.PI * 2,              // 上下浮动的相位
        seed: (rnd() * 1e6) | 0
      });
    }
  })();

  function drawCloud(x, y, w, h) {
    const puffs = [
      [0.22, 0.62, 0.26],
      [0.41, 0.42, 0.35],
      [0.63, 0.50, 0.30],
      [0.82, 0.64, 0.20]
    ];

    // 亮部柔光：云背后先铺一层暖光，和夕阳同源
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const gg = ctx.createRadialGradient(x + w * 0.48, y + h * 0.56, 0,
                                        x + w * 0.48, y + h * 0.56, w * 0.58);
    gg.addColorStop(0.00, 'rgba(255, 238, 214, 0.14)');
    gg.addColorStop(0.55, 'rgba(255, 214, 178, 0.045)');
    gg.addColorStop(1.00, 'rgba(255, 200, 170, 0)');
    ctx.fillStyle = gg;
    ctx.fillRect(x - w * 0.15, y - h * 0.15, w * 1.3, h * 1.5);
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);

    ctx.beginPath();
    ctx.rect(w * 0.07, h * 0.64, w * 0.86, h * 0.32);
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i];
      ctx.moveTo(p[0] * w + p[2] * h, p[1] * h);
      ctx.arc(p[0] * w, p[1] * h, p[2] * h, 0, Math.PI * 2);
    }
    ctx.clip();

    // 上亮下暗的纯色带：表现体积；底部带一点夕阳反照的暖粉，和天空同一个光
    const bands = [
      [0.00, '#FFFDFA'],
      [0.34, '#FFF6EE'],
      [0.58, '#FCE7DA'],
      [0.78, '#F5D2C2'],
      [0.92, '#EDBDAD']
    ];
    for (let i = 0; i < bands.length; i++) {
      const y0 = bands[i][0] * h;
      const y1 = (i + 1 < bands.length ? bands[i + 1][0] : 1) * h;
      ctx.fillStyle = bands[i][1];
      ctx.fillRect(0, y0, w, y1 - y0);
    }

    // 每团底部压一道暗月牙，暗示圆滚滚的球体
    for (let i = 0; i < puffs.length; i++) {
      const px = puffs[i][0] * w;
      const py = puffs[i][1] * h;
      const pr = puffs[i][2] * h;
      const a1 = Math.asin(0.42), a2 = Math.PI - a1;
      ctx.beginPath();
      ctx.moveTo(px + pr * Math.cos(a1), py + pr * Math.sin(a1));
      ctx.arc(px, py, pr, a1, a2);
      ctx.closePath();
      ctx.fillStyle = 'rgba(196,168,178,0.34)';
      ctx.fill();
    }

    ctx.restore();
  }

  function drawClouds() {
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const span = W + c.w;
      let x = (c.x0 - t * c.spd) % span;
      if (x < 0) x += span;
      // 除了后退，还轻轻上下浮动
      const bob = Math.sin(t * 0.8 + c.ph) * H * 0.005;
      drawCloud(x - c.w, c.y + bob, c.w, c.h);
    }
  }

  /* ==================== 山（三层景深） ==================== */
  const ridgeSpecs = [
    { seed: 7,  hMin: 0.40, amp: 0.90, speed: 20,
      cBase: '#7E9A8C', cLight: '#96AFA1', cDark: '#688274', base: yMtn - 4, count: 6 },
    { seed: 23, hMin: 0.45, amp: 0.70, speed: 38,
      cBase: '#4E7B56', cLight: '#63936B', cDark: '#395F41', base: yMtn + 1, count: 5 },
    { seed: 41, hMin: 0.50, amp: 0.50, speed: 62,
      cBase: '#2B5E3A', cLight: '#387145', cDark: '#1C4227', base: yMtn + 4, count: 4 }
  ];
  for (let i = 0; i < ridgeSpecs.length; i++) {
    ridgeSpecs[i].h = makeRidge(ridgeSpecs[i].seed, ridgeSpecs[i].count, ridgeSpecs[i].hMin);
  }

  // 预生成每层山脊的折线 / 裁切路径 / 描边路径（形状是常量，不必每帧重算）
  for (let i = 0; i < ridgeSpecs.length; i++) {
    const L = ridgeSpecs[i];
    const amp = L.amp * mtnH;
    const bottom = yMtn + 8;
    L.clipPath = new Path2D();
    L.rimPath = new Path2D();
    L.clipPath.moveTo(-2, bottom);
    for (let x = 0; x <= W + 8; x += 8) {
      const y = L.base - amp * L.h(Math.min(1, x / W));
      L.clipPath.lineTo(x, y);
      if (x === 0) L.rimPath.moveTo(x, y); else L.rimPath.lineTo(x, y);
    }
    L.clipPath.lineTo(W + 10, bottom);
    L.clipPath.closePath();
  }

  function drawHills() {
    for (let i = 0; i < ridgeSpecs.length; i++) {
      const L = ridgeSpecs[i];
      const amp = L.amp * mtnH;
      const off = (t * L.speed) % W;
      const bottom = yMtn + 8;

      for (let k = 0; k < 2; k++) {
        const ox = -off + k * W;

        // 按山脊轮廓裁切
        ctx.save();
        ctx.translate(ox, 0);
        ctx.clip(L.clipPath);

        // 底色（顺便盖住分段接缝）
        ctx.fillStyle = L.cBase;
        ctx.fillRect(-2, ySky - 12, W + 4, mtnH + 42);

        // 按坡度分段上色：迎光面亮、背光面暗 → 低多边形立体块面
        const SEG = 96;
        for (let x = 0; x < W; x += SEG) {
          const xa = x, xb = Math.min(x + SEG, W);
          const y1 = L.base - amp * L.h(xa / W);
          const y2 = L.base - amp * L.h(xb / W);
          const m = (y2 - y1) / (xb - xa);
          let s = Math.max(0, Math.min(1, 0.5 - m * 2.3));
          s = Math.round(s * 3) / 3;           // 量化成 4 级色阶，块面更硬朗
          ctx.fillStyle = mixColor(L.cDark, L.cLight, s);
          ctx.beginPath();
          ctx.moveTo(xa, y1);
          ctx.lineTo(xb, y2);
          ctx.lineTo(xb + 0.8, bottom);
          ctx.lineTo(xa, bottom);
          ctx.closePath();
          ctx.fill();
        }

        // 山脚压暗，块面才有厚度
        const ao = ctx.createLinearGradient(0, ySky, 0, bottom);
        ao.addColorStop(0, 'rgba(0,0,0,0)');
        ao.addColorStop(0.6, 'rgba(0,0,0,0.04)');
        ao.addColorStop(1, 'rgba(0,0,0,0.22)');
        ctx.fillStyle = ao;
        ctx.fillRect(-2, ySky - 12, W + 4, mtnH + 42);

        ctx.restore();
      }

      // 空气透视：越远的山越往天空的橙色里褪（两端淡入淡出，避免出现硬边）
      if (i < 2) {
        const a = i === 0 ? 0.16 : 0.08;
        const top = ySky - H * 0.07;
        const hz = ctx.createLinearGradient(0, top, 0, yMtn);
        hz.addColorStop(0, 'rgba(255, 158, 58, 0)');
        hz.addColorStop((ySky - top) / (yMtn - top), 'rgba(255, 158, 58,' + a + ')');
        hz.addColorStop(1, 'rgba(255, 158, 58, 0)');
        ctx.fillStyle = hz;
        ctx.fillRect(0, top, W, yMtn - top + 2);
      }

      // 逆光描边：太阳那一侧的山脊被点亮，轮廓从天空里“脱”出来
      for (let k = 0; k < 2; k++) {
        const ox = -off + k * W;
        ctx.save();
        ctx.translate(ox, 0);
        const f = SUN_X / W;
        const rimA = i === 0 ? 0.90 : (i === 1 ? 0.70 : 0.46);
        const gx = ctx.createLinearGradient(-ox, 0, W - ox, 0);
        gx.addColorStop(0.00, 'rgba(255, 208, 158, ' + (rimA * 0.22).toFixed(3) + ')');
        gx.addColorStop(Math.max(0.01, f - 0.38), 'rgba(255, 224, 180, ' + (rimA * 0.50).toFixed(3) + ')');
        gx.addColorStop(f, 'rgba(255, 248, 226, ' + rimA.toFixed(3) + ')');
        gx.addColorStop(Math.min(0.99, f + 0.26), 'rgba(255, 218, 168, ' + (rimA * 0.58).toFixed(3) + ')');
        gx.addColorStop(1.00, 'rgba(255, 200, 152, ' + (rimA * 0.34).toFixed(3) + ')');
        ctx.strokeStyle = gx;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        // 先一道宽的柔光，再压一道细亮线
        ctx.globalAlpha = 0.16;
        ctx.lineWidth = (i === 0 ? 5.2 : (i === 1 ? 3.8 : 2.8)) * 2.2;
        ctx.stroke(L.rimPath);
        ctx.globalAlpha = 1;
        ctx.lineWidth = i === 0 ? 3.0 : (i === 1 ? 2.4 : 1.8);
        ctx.stroke(L.rimPath);
        ctx.restore();
      }
    }
  }

  /* ==================== 公路 ==================== */
  // 画面最下沿的速度拖影（越靠近镜头越快）
  const SMEARS = (function () {
    const rnd = mulberry32(9021);
    const out = [];
    for (let i = 0; i < 9; i++) {
      out.push({
        y: H * (0.966 + rnd() * 0.032),
        w: W * (0.08 + rnd() * 0.24),
        h: 1.0 + rnd() * 2.6,
        a: 0.030 + rnd() * 0.050,
        sp: 2.0 + rnd() * 2.4
      });
    }
    return out;
  })();

  // 边缘不齐、有磨损缺口的旧白线
  function wornDash(x, y, w, h, seed, color) {
    const rnd = mulberry32(seed);
    const jy = h * 0.10, jx = h * 0.12;
    const a0 = ctx.globalAlpha;
    const x0 = x + (rnd() - 0.5) * jx;
    const x1 = x + w + (rnd() - 0.5) * jx;
    const y0 = y + (rnd() - 0.5) * jy;
    const y1 = y + h + (rnd() - 0.5) * jy;

    ctx.fillStyle = color;
    ctx.globalAlpha = a0 * (0.70 + rnd() * 0.28);
    ctx.beginPath();
    ctx.moveTo(x0 + h * 0.5, y0);
    ctx.lineTo(x1 - h * 0.45, y0 + (rnd() - 0.5) * jy * 0.6);
    ctx.lineTo(x1, y0 + h * 0.5);
    ctx.lineTo(x1 - h * 0.40, y1);
    ctx.lineTo(x0 + h * 0.45, y1 + (rnd() - 0.5) * jy * 0.5);
    ctx.lineTo(x0, y0 + h * 0.5);
    ctx.closePath();
    ctx.fill();

    // 掉漆的小缺口
    ctx.globalAlpha = a0 * 0.55;
    ctx.fillStyle = 'rgba(96,96,101,1)';
    for (let i = 0; i < 2; i++) {
      const wx = x0 + (0.22 + rnd() * 0.56) * (x1 - x0);
      const wy = y0 + (0.2 + rnd() * 0.6) * (y1 - y0);
      ctx.beginPath();
      ctx.ellipse(wx, wy, h * (0.08 + rnd() * 0.12), h * (0.06 + rnd() * 0.10), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = a0;
  }

  function drawGuardrail(top, alpha) {
    if (alpha <= 0.02) return;
    const off = (t * SPEED) % 168;
    const railH = H * 0.0115;
    const railY = top - H * 0.046;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 立柱（受光边朝太阳一侧）
    for (let x = -off - 168; x < W + 168; x += 168) {
      ctx.fillStyle = '#2C2F33';
      ctx.fillRect(x, railY + railH * 0.4, H * 0.0105, H * 0.046);
      ctx.fillStyle = 'rgba(226, 206, 184, 0.28)';
      ctx.fillRect(x + H * 0.0082, railY + railH * 0.4, H * 0.0020, H * 0.046);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.fillRect(x - H * 0.004, top + H * 0.001, H * 0.021, H * 0.008);
    }

    // 横梁：一条暗铁色 + 上沿被夕阳照亮
    ctx.fillStyle = '#4B4F54';
    ctx.fillRect(-W, railY, W * 3, railH);
    ctx.fillStyle = 'rgba(255, 232, 200, 0.55)';
    ctx.fillRect(-W, railY, W * 3, H * 0.0034);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(-W, railY + railH, W * 3, H * 0.0034);
    ctx.restore();
  }

  function drawRoad(p, top) {
    const det = Math.max(0, 1 - p * 2.6);          // 俯视时收掉侧视专属细节

    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, '#54545A');
    g.addColorStop(0.42, '#686970');
    g.addColorStop(1, '#7B7B80');
    ctx.fillStyle = g;
    ctx.fillRect(-W, top, W * 3, H * 4);

    // 远处路面被夕阳染一点暖色
    const hz = ctx.createLinearGradient(0, top, 0, top + H * 0.085);
    hz.addColorStop(0, 'rgba(255, 168, 92, 0.18)');
    hz.addColorStop(1, 'rgba(255, 168, 92, 0)');
    ctx.fillStyle = hz;
    ctx.fillRect(-W, top, W * 3, H * 0.085);

    // 沥青细噪点（跟着路面往左滚）
    const aOff = (t * SPEED) % 200;
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.40 * (1 - p * 0.40);
    for (let x = -aOff - 200; x < W + 200; x += 200) {
      for (let y = top; y < H; y += 200) {
        ctx.drawImage(asphaltTile, x, y);
      }
    }
    ctx.restore();

    // 路肩亮线 + 阴影（随路面一起移出画面）
    if (p < 0.98) {
      const lineH = Math.max(2, H * 0.0022);
      ctx.fillStyle = 'rgba(236,239,243,0.85)';
      ctx.fillRect(-W, top + 5, W * 3, lineH);
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.fillRect(-W, top + 5 + lineH, W * 3, Math.max(2, H * 0.0045));
    }

    // 白虚线：从车身后方逐渐移到车身正中，俯视时正好从车底穿过
    const dashW = H * 0.055;
    const gapW = H * 0.062;
    const period = dashW + gapW;
    const dashH = H * 0.0095;
    const yD = carBaseY - H * (0.034 * (1 - p) + 0.004 * p);
    const off = (t * SPEED) % period;

    // 远车道的虚线：更小、更淡、更慢 —— 一条简易透视
    const period2 = period * 0.56;
    const off2 = (t * SPEED * 0.58) % period2;
    const yD2 = yD - H * 0.045;
    for (let x = -off2 - W * 2; x < W * 3; x += period2) {
      const idx = Math.round((x + off2) / period2);
      wornDash(x, yD2, dashW * 0.56, dashH * 0.56, Math.abs(idx) * 271 + 31,
               'rgba(228,230,235,0.70)');
    }

    // 近车道的中线
    for (let x = -off - W * 2; x < W * 3; x += period) {
      const idx = Math.round((x + off) / period);
      wornDash(x, yD, dashW, dashH, Math.abs(idx) * 131 + 17,
               'rgba(240,242,246,0.92)');
    }

    // 护栏立柱（只在侧视时出现）
    drawGuardrail(top, det);

    // 画面最下沿的速度拖影
    if (det > 0.02) {
      for (let i = 0; i < SMEARS.length; i++) {
        const s = SMEARS[i];
        const span = W * 1.9;
        const x = W * 1.25 - ((t * SPEED * s.sp + i * 517) % span);
        const lg = ctx.createLinearGradient(x, 0, x + s.w, 0);
        lg.addColorStop(0.00, 'rgba(255,248,238,0)');
        lg.addColorStop(0.50, 'rgba(255,248,238,' + (s.a * det).toFixed(3) + ')');
        lg.addColorStop(1.00, 'rgba(255,248,238,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(x, s.y, s.w, s.h);
      }
    }
  }

  /* ==================== 小车（3D 棱柱 · 纯色块） ==================== */
  let YAW = 20 * Math.PI / 180;       // 绕 y 轴偏一点，露出车头和另一侧车轮
  let PITCH = 11 * Math.PI / 180;     // 略俯视，露出车顶
  let CY = Math.cos(YAW), SY = Math.sin(YAW);
  let CP = Math.cos(PITCH), SP = Math.sin(PITCH);

  // 转场：双击小车 → 升到车顶（view.p 0→1），继续升高 → 中国地图（1→2）
  const view = { p: 0, target: 0 };
  let carBaseX = 0, carBaseY = 0;

  // 地图缩放 / 平移（滚轮 + 拖拽）
  const mapView = { zoom: 1, x: 0, y: 0 };
  let mapLayout = null;        // 当前地图在画面里的位置（每帧更新）
  let followCar = false;       // 是否让地图自动跟随最新位置

  // 分步缓动，每步：{ to, dur, hold }
  let anim = null;
  let lastNow = 0;             // 用同一个时钟（rAF 时间戳）驱动动画，避免两套时钟
  function playSequence(list) {
    let from = view.p;
    const steps = list.map(function (it) {
      const st = { from: from, to: it.to, dur: it.dur, hold: it.hold || 0 };
      from = it.to;
      return st;
    });
    anim = { steps: steps, i: 0, t0: lastNow || performance.now() };
    view.target = steps[steps.length - 1].to;
  }

  function updateCamera() {
    const p = Math.min(1, view.p);             // 第二阶段（地图）保持俯视
    YAW = (20 - 20 * p) * Math.PI / 180;       // 20° → 0°：正对车头
    PITCH = (11 + 79 * p) * Math.PI / 180;     // 11° → 90°：正上方
    CY = Math.cos(YAW); SY = Math.sin(YAW);
    CP = Math.cos(PITCH); SP = Math.sin(PITCH);
  }

  // 预览/调试用：?p=0.5 停在转场中途；?auto=1 打开页面就自动播一次
  (function () {
    const m = /[?&]p=([0-9.]+)/.exec(location.search);
    if (m) {
      view.p = Math.max(0, Math.min(2, parseFloat(m[1])));
      view.target = view.p;
    }
    if (/[?&]auto=1/.test(location.search)) playSequence([{ to: 1, dur: 1700, hold: 350 }, { to: 2, dur: 2100 }]);
    const mz = /[?&]z=([0-9.]+)/.exec(location.search);
    if (mz) mapView.zoom = Math.max(1, Math.min(6, parseFloat(mz[1])));
  })();

  // 侧视轮廓（x 向右、y 向上，逆时针）
  const BODY = [
    [-0.86, 0.24], [0.86, 0.24], [0.86, 0.52], [0.72, 0.60],
    [0.30, 0.62], [0.10, 0.93], [-0.44, 0.93], [-0.62, 0.64], [-0.86, 0.58]
  ];
  const BODY_Z = 0.30;                // 车身半宽
  const GLASS = '#2A3644';
  const RED_SIDE = '#DA3B33';
  const RED_TOP = '#F5685E';
  const RED_FRONT = '#C3322C';

  let carK = 1, carX = 0, carY = 0;

  // 车身局部坐标 (x 右, y 上, z 朝镜头) → 屏幕
  function P(x, y, z) {
    const d = x * SY + z * CY;
    return [
      carX + (x * CY - z * SY) * carK,
      carY + (-y * CP + d * SP) * carK
    ];
  }

  function poly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function disc(x, y, z, r, color) {
    const n = 16, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push(P(x + Math.cos(a) * r, y + Math.sin(a) * r, z));
    }
    poly(pts, color);
  }

  // 点集的凸包（用来画轮胎两端的“厚度”）
  function hull(points) {
    const pts = points.slice().sort(function (a, b) {
      return a[0] - b[0] || a[1] - b[1];
    });
    const cross = function (o, a, b) {
      return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    };
    const lower = [], upper = [];
    for (let i = 0; i < pts.length; i++) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) lower.pop();
      lower.push(pts[i]);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[i]) <= 0) upper.pop();
      upper.push(pts[i]);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function wheel(x, z, far) {
    const r = 0.16, y = 0.16, dir = z > 0 ? 1 : -1;
    const cTire  = far ? '#0A0B0C' : '#191A1D';
    const cRim   = far ? '#343A42' : '#4A505A';
    const cSpoke = far ? '#7A828C' : '#A7B0BC';
    const cHub   = far ? '#949CA7' : '#C6CDD7';

    // 胎面：两端圆的外轮廓，俯视时露出的就是这一圈“厚度”
    const ring = [];
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      ring.push(P(px, py, z));
      ring.push(P(px, py, z - dir * 0.09));
    }
    poly(hull(ring), far ? '#08090A' : '#101113');

    disc(x, y, z, r, cTire);                           // 轮胎端面
    disc(x, y, z + dir * 0.002, r * 0.60, cRim);       // 轮辋

    // 车向画面右侧开 → 轮子顺时针转；局部 y 轴向上、投影时翻转，所以角度取负
    const ang = -(t * SPEED) / (r * carK);
    ctx.strokeStyle = cSpoke;
    ctx.lineWidth = r * 0.20 * carK;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = ang + (i / 5) * Math.PI * 2;
      const p1 = P(x + Math.cos(a) * r * 0.18, y + Math.sin(a) * r * 0.18, z + dir * 0.003);
      const p2 = P(x + Math.cos(a) * r * 0.46, y + Math.sin(a) * r * 0.46, z + dir * 0.003);
      ctx.beginPath();
      ctx.moveTo(p1[0], p1[1]);
      ctx.lineTo(p2[0], p2[1]);
      ctx.stroke();
    }
    disc(x, y, z + dir * 0.004, r * 0.17, cHub);       // 中心盖
  }

  function drawCar() {
    const carH = H * 0.145;
    carK = carH / 0.93;
    carX = carBaseX;
    carY = carBaseY;

    // 侧视专属细节（轮眉、轮廓光、尾灯、上下浮动）在俯视时全部收掉
    const sideP = Math.min(1, Math.max(0, view.p));
    const det = Math.max(0, 1 - sideP * 2.2);

    // 行驶时车身极轻微上下浮动
    if (det > 0.01) carY += Math.sin(t * 2.35) * H * 0.0017 * det;

    // 双击反馈：轻微跳一下 + 放大一点
    if (pulse > 0) {
      carY -= H * 0.012 * pulse;
      carK *= 1 + 0.06 * pulse;
    }

    // 地面投影
    const sw = carH * 1.75 * 0.55;
    ctx.save();
    ctx.translate(carX, carY);
    ctx.scale(1, 0.16);
    const sg = ctx.createRadialGradient(0, 0, sw * 0.05, 0, 0, sw);
    sg.addColorStop(0, 'rgba(0,0,0,0.34)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, sw, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 接地阴影：贴着轮胎的一小团更实的暗
    if (det > 0.01) {
      ctx.save();
      ctx.globalAlpha = 0.55 * det;
      ctx.translate(carX, carY + carK * 0.012);
      ctx.scale(1, 0.10);
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, carK * 1.16);
      cg.addColorStop(0.00, 'rgba(0,0,0,0.55)');
      cg.addColorStop(0.55, 'rgba(0,0,0,0.22)');
      cg.addColorStop(1.00, 'rgba(0,0,0,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, carK * 1.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 远端两个车轮（先画，之后会被车身挡住；裁到侧裙以上，免得在车底露出黑月牙）
    const rk0 = P(-0.86, 0.24, BODY_Z), rk1 = P(0.86, 0.24, BODY_Z);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(rk0[0] - 4000, rk0[1] - 4000);
    ctx.lineTo(rk1[0] + 4000, rk1[1] - 4000);
    ctx.lineTo(rk1[0] + 4000, rk1[1]);
    ctx.lineTo(rk0[0] - 4000, rk0[1]);
    ctx.closePath();
    ctx.clip();
    wheel(-0.55, -0.40, true);
    wheel(0.55, -0.40, true);
    ctx.restore();

    // 车身：只画朝向镜头的棱面，每个面一个纯色
    for (let i = 0; i < BODY.length; i++) {
      const a = BODY[i], b = BODY[(i + 1) % BODY.length];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = dy / len, ny = -dx / len;
      if (nx * SY * CP + ny * SP <= 0.02) continue;      // 背对镜头的面不画
      let col;
      if (i === 4 || i === 6) col = GLASS;          // 前挡风 / 后窗
      else if (i === 5) col = '#F87068';            // 车顶
      else if (i === 3) col = '#E85A50';            // 引擎盖
      else col = ny > 0.7 ? RED_TOP : (nx > 0.5 ? RED_FRONT : RED_SIDE);
      poly([
        P(a[0], a[1], -BODY_Z), P(b[0], b[1], -BODY_Z),
        P(b[0], b[1], BODY_Z), P(a[0], a[1], BODY_Z)
      ], col);
    }

    // 近侧大面
    poly(BODY.map(function (p) { return P(p[0], p[1], BODY_Z); }), RED_SIDE);

    // 侧窗
    const zw = BODY_Z + 0.002;
    poly([P(0.20, 0.655, zw), P(0.09, 0.875, zw), P(-0.06, 0.875, zw), P(-0.06, 0.655, zw)], GLASS);
    poly([P(-0.12, 0.875, zw), P(-0.38, 0.875, zw), P(-0.50, 0.655, zw), P(-0.12, 0.655, zw)], GLASS);
    poly([P(0.17, 0.675, zw + 0.001), P(0.08, 0.855, zw + 0.001),
          P(0.02, 0.855, zw + 0.001), P(0.04, 0.675, zw + 0.001)],
         'rgba(255,255,255,0.10)');

    // 车底暗色块（侧裙），让车身有厚度
    poly([P(-0.86, 0.24, zw), P(0.86, 0.24, zw), P(0.86, 0.30, zw), P(-0.86, 0.30, zw)], '#B92C26');

    // ——— 侧视质感 ———
    if (det > 0.01) {
      // 轮眉暗部：轮胎上方压一道暗弧，车身不再是平的色块
      for (let wI = 0; wI < 2; wI++) {
        const wx = wI === 0 ? -0.55 : 0.55;
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const ang = Math.PI * (0.10 + 0.80 * i / 12);
          const pp = P(wx + Math.cos(ang) * 0.232, 0.16 + Math.sin(ang) * 0.232, BODY_Z + 0.001);
          if (i === 0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
        }
        ctx.strokeStyle = 'rgba(146, 30, 24, ' + (0.42 * det).toFixed(3) + ')';
        ctx.lineWidth = 0.042 * carK;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // 轮廓光：车顶 / 引擎盖的上沿被夕阳描了一道
      const rimPts = [2, 3, 4, 5, 6, 7, 8].map(function (i) {
        return P(BODY[i][0], BODY[i][1], BODY_Z + 0.001);
      });
      ctx.beginPath();
      ctx.moveTo(rimPts[0][0], rimPts[0][1]);
      for (let i = 1; i < rimPts.length; i++) ctx.lineTo(rimPts[i][0], rimPts[i][1]);
      ctx.strokeStyle = 'rgba(255, 218, 180, ' + (0.72 * det).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, carK * 0.014);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      // 车顶再补一点高光
      poly([P(0.28, 0.925, BODY_Z - 0.02), P(0.10, 0.925, BODY_Z - 0.02),
            P(0.10, 0.925, BODY_Z - 0.14), P(0.28, 0.925, BODY_Z - 0.14)],
           'rgba(255, 226, 200, ' + (0.16 * det).toFixed(3) + ')');
    }

    // 前灯（车头那面）
    poly([P(0.861, 0.38, 0.10), P(0.861, 0.38, 0.27),
          P(0.861, 0.48, 0.27), P(0.861, 0.48, 0.10)], '#F7C64B');

    // 车灯柔光 + 前方路面的一点光斑
    if (det > 0.01) {
      const hp = P(0.862, 0.44, 0.185);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const R = carK * 0.44;
      const hg = ctx.createRadialGradient(hp[0], hp[1], 0, hp[0], hp[1], R);
      hg.addColorStop(0.00, 'rgba(255, 226, 150, ' + (0.55 * det).toFixed(3) + ')');
      hg.addColorStop(0.40, 'rgba(255, 196, 110, ' + (0.18 * det).toFixed(3) + ')');
      hg.addColorStop(1.00, 'rgba(255, 180, 90, 0)');
      ctx.fillStyle = hg;
      ctx.fillRect(hp[0] - R, hp[1] - R, R * 2, R * 2);

      // 尾灯微亮（车尾那一角）
      const tp = P(-0.868, 0.40, BODY_Z * 0.72);
      const TR = carK * 0.40;
      const tg = ctx.createRadialGradient(tp[0], tp[1], 0, tp[0], tp[1], TR);
      tg.addColorStop(0.00, 'rgba(255, 78, 58, ' + (0.50 * det).toFixed(3) + ')');
      tg.addColorStop(0.45, 'rgba(255, 52, 38, ' + (0.16 * det).toFixed(3) + ')');
      tg.addColorStop(1.00, 'rgba(255, 40, 30, 0)');
      ctx.fillStyle = tg;
      ctx.fillRect(tp[0] - TR, tp[1] - TR, TR * 2, TR * 2);
      ctx.restore();

      // 车头前方的淡淡光斑
      ctx.save();
      ctx.globalAlpha = 0.10 * det;
      ctx.translate(carX + carK * 1.55, carY + carK * 0.02);
      ctx.scale(1, 0.13);
      const lpg = ctx.createRadialGradient(0, 0, 0, 0, 0, carK * 0.95);
      lpg.addColorStop(0.00, 'rgba(255, 214, 150, 0.55)');
      lpg.addColorStop(1.00, 'rgba(255, 196, 120, 0)');
      ctx.fillStyle = lpg;
      ctx.beginPath();
      ctx.arc(0, 0, carK * 0.95, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 近端车轮
    wheel(-0.55, 0.40);
    wheel(0.55, 0.40);
  }

  /* ==================== 文案 ==================== */
  function drawTitle(alpha) {
    const fontOf = function (sz) {
      return '700 ' + sz + 'px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
    };

    const size = H * 0.062;
    const big = size * 1.32;          // “善迹”大一号
    const lh = size * 1.55;
    const cx = W * 0.335;
    const cy = H * 0.42;

    const lines = [
      [['【感谢您的无私奉献', size]],
      [['双击小车', size]],
      [['找寻您的“', size], ['善迹', big], ['”】', size]]
    ];

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#6B2A11';
    ctx.shadowColor = 'rgba(255, 232, 196, 0.7)';
    ctx.shadowBlur = H * 0.003;
    ctx.shadowOffsetY = H * 0.0012;

    // 先量一遍每行宽度，三行统一左对齐（第一行和第三行左端对齐）
    let maxW = 0;
    const widths = [];
    for (let i = 0; i < lines.length; i++) {
      let w = 0;
      for (let j = 0; j < lines[i].length; j++) {
        ctx.font = fontOf(lines[i][j][1]);
        w += ctx.measureText(lines[i][j][0]).width;
      }
      widths.push(w);
      if (w > maxW) maxW = w;
    }

    const x0 = cx - maxW / 2;

    for (let i = 0; i < lines.length; i++) {
      const parts = lines[i];
      // 第一、三行左对齐；中间那行在整块宽度里居中
      let x = i === 1 ? x0 + (maxW - widths[1]) / 2 : x0;
      const y = cy + (i - 1) * lh;
      for (let j = 0; j < parts.length; j++) {
        ctx.font = fontOf(parts[j][1]);
        ctx.fillText(parts[j][0], x, y);
        x += ctx.measureText(parts[j][0]).width;
      }
    }
    ctx.restore();
  }

    ctx.fill();
    ctx.lineWidth = H * 0.0024 * zk;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.stroke();

    ctx.fillStyle = '#1E2833';                                  // 前挡风
    ctx.fillRect(len * 0.00, -wid * 0.34, len * 0.15, wid * 0.68);
    ctx.fillStyle = '#F7C64B';                                  // 车灯
    ctx.fillRect(len * 0.40, -wid * 0.32, len * 0.08, wid * 0.22);
    ctx.fillRect(len * 0.40, wid * 0.10, len * 0.08, wid * 0.22);

    ctx.restore();
  }

  // 轨迹：连线 + 历史红点 + 最新位置的小车
  function drawTrack(ox, oy, mapW, mapH) {
    const n = TRACK.length;
    if (!n) return;
    const zk = 1 / mapView.zoom;
    const px = [], py = [];
    for (let i = 0; i < n; i++) {
      px.push(ox + ((TRACK[i].lng - MAP_LON0) / MAP_LON_SPAN) * mapW);
      py.push(oy + ((MAP_LAT0 - TRACK[i].lat) / MAP_LAT_SPAN) * mapH);
    }

    if (n > 1) {
      ctx.beginPath();
      ctx.moveTo(px[0], py[0]);
      for (let i = 1; i < n; i++) ctx.lineTo(px[i], py[i]);
      ctx.lineWidth = H * 0.0042 * zk;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255, 112, 90, 0.55)';
      ctx.stroke();
    }

    for (let i = 0; i < n - 1; i++) {
      ctx.beginPath();
      ctx.arc(px[i], py[i], H * 0.0090 * zk, 0, Math.PI * 2);
      ctx.fillStyle = '#E8483A';
      ctx.fill();
      ctx.lineWidth = H * 0.0022 * zk;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.stroke();
    }

    let ang = 0;
    if (n > 1) ang = Math.atan2(py[n - 1] - py[n - 2], px[n - 1] - px[n - 2]);
    drawCarIcon(px[n - 1], py[n - 1], ang, zk);
  }

  // 标准中国地图必备的「南海诸岛」小图（含九段线）
  function drawInset(ox, oy, mapW, mapH) {
    const w = mapW * 0.16;
    const h = w * 1.2;
    const x = ox + mapW - w - mapW * 0.012;
    const y = oy + mapH - h - mapH * 0.02;
    const zk = 1 / mapView.zoom;

    ctx.save();
    ctx.fillStyle = 'rgba(6, 18, 30, 0.94)';
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = Math.max(1, H * 0.0013) * zk;
    ctx.strokeStyle = 'rgba(104,178,235,0.55)';
    ctx.strokeRect(x, y, w, h);

    ctx.beginPath();
    for (let p = 0; p < CHINA_SEA.length; p++) {
      const poly = CHINA_SEA[p];
      ctx.moveTo(x + poly[0][0] * w, y + poly[0][1] * h);
      for (let i = 1; i < poly.length; i++) {
        ctx.lineTo(x + poly[i][0] * w, y + poly[i][1] * h);
      }
      ctx.closePath();
    }
    ctx.fillStyle = '#123A57';
    ctx.fill();
    ctx.lineWidth = Math.max(0.7, H * 0.0011) * zk;
    ctx.strokeStyle = 'rgba(104,178,235,0.75)';
    ctx.stroke();

    ctx.font = '600 ' + Math.round(H * 0.016 * zk) + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(150,192,226,0.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('南海诸岛', x + w / 2, y - H * 0.006 * zk);
    ctx.restore();
  }

  function mapLayoutAt(scale) {
    const mapH = H * 0.95 * scale;
    const mapW = mapH * 1.45;
    return { ox: W / 2 - mapW / 2, oy: H / 2 - mapH / 2, w: mapW, h: mapH };
  }

  function drawMap(alpha, scale, reveal) {
    const L = mapLayoutAt(scale);
    const mapH = L.h, mapW = L.w, ox = L.ox, oy = L.oy;

    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha);

    // 从中间那条线向上下展开（和轨迹走向同一个轴）
    if (reveal !== undefined && reveal < 0.999) {
      const rh = Math.max(2, H * 1.32 * reveal);
      ctx.beginPath();
      ctx.rect(-W, H / 2 - rh / 2, W * 3, rh);
      ctx.clip();
    }

    // 深色底
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#06101C');
    bg.addColorStop(1, '#0B1B2B');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = 'rgba(70,120,170,0.12)';
    ctx.lineWidth = Math.max(1, H * 0.001);
    for (let i = 0; i <= 12; i++) {
      const x = (W / 12) * i;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const y = (H / 6) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    mapLayout = { ox: ox, oy: oy, w: mapW, h: mapH };

    // 陆地 + 定位点：跟随滚轮缩放 / 拖拽平移
    ctx.save();
    ctx.translate(W / 2 + mapView.x, H / 2 + mapView.y);
    ctx.scale(mapView.zoom, mapView.zoom);
    ctx.translate(-W / 2, -H / 2);

    // 中国轮廓
    ctx.beginPath();
    for (let p = 0; p < CHINA.length; p++) {
      const poly = CHINA[p];
      ctx.moveTo(ox + poly[0][0] * mapW, oy + poly[0][1] * mapH);
      for (let i = 1; i < poly.length; i++) {
        ctx.lineTo(ox + poly[i][0] * mapW, oy + poly[i][1] * mapH);
      }
      ctx.closePath();
    }
    ctx.fillStyle = '#123A57';
    ctx.fill();
    ctx.lineWidth = Math.max(1.4, H * 0.0016);
    ctx.strokeStyle = 'rgba(104,178,235,0.7)';
    ctx.stroke();

    // 轨迹 + 红点 + 最新位置的小车
    drawTrack(ox, oy, mapW, mapH);

    // 南海诸岛小图
    drawInset(ox, oy, mapW, mapH);

    ctx.restore();

    // 操作提示
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '600 ' + Math.round(H * 0.021) + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(150, 192, 226, 0.55)';
    ctx.fillText('滚轮缩放 · 拖拽平移 · 双击返回', W * 0.03, H * 0.955);

    ctx.restore();
  }

  // 给导航系统留的接口
  function pointToScreen(lng, lat) {
    if (!mapLayout) return null;
    return [
      mapLayout.ox + ((lng - MAP_LON0) / MAP_LON_SPAN) * mapLayout.w,
      mapLayout.oy + ((MAP_LAT0 - lat) / MAP_LAT_SPAN) * mapLayout.h
    ];
  }

  function centerOn(lng, lat) {
    const pt = pointToScreen(lng, lat);
    if (!pt) return;
    mapView.x = -(pt[0] - W / 2) * mapView.zoom;
    mapView.y = -(pt[1] - H / 2) * mapView.zoom;
  }

  window.carNav = {
    setPosition: function (lng, lat) {
      const last = TRACK[TRACK.length - 1];
      if (!last || Math.abs(last.lng - lng) > 1e-6 || Math.abs(last.lat - lat) > 1e-6) {
        TRACK.push({ lng: lng, lat: lat });
        if (TRACK.length > 300) TRACK.shift();
      }
      if (followCar && view.p > 1.2) centerOn(lng, lat);
    },
    setTrack: function (list) {
      if (!list || !list.length) return;
      TRACK.length = 0;
      for (let i = 0; i < list.length; i++) {
        const it = list[i];
        const lng = Array.isArray(it) ? it[0] : it.lng;
        const lat = Array.isArray(it) ? it[1] : it.lat;
        if (typeof lng === "number" && typeof lat === "number") TRACK.push({ lng: lng, lat: lat });
      }
      if (TRACK.length > 300) TRACK.splice(0, TRACK.length - 300);
      if (followCar && TRACK.length) centerOn(TRACK[TRACK.length - 1].lng, TRACK[TRACK.length - 1].lat);
    },
    getTrack: function () {
      return TRACK.map(function (p) { return { lng: p.lng, lat: p.lat }; });
    },
    clearTrack: function () { TRACK.length = 0; },
    zoomTo: function (z) { mapView.zoom = Math.max(1, Math.min(6, z)); },
    follow: function (on) {
      followCar = !!on;
      if (followCar && TRACK.length) {
        const last = TRACK[TRACK.length - 1];
        centerOn(last.lng, last.lat);
      }
    },
    isOpen: function () { return view.p > 1.2; },
    open: function () { playSequence([{ to: 1, dur: 1700, hold: 350 }, { to: 2, dur: 2100 }]); },
    close: function () { playSequence([{ to: 1, dur: 1500 }, { to: 0, dur: 2200 }]); }
  };

  /* ==================== 渲染 ==================== */
  // 平滑过渡
  function smooth(a, b, x) {
    const u = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return u * u * (3 - 2 * u);
  }

  // F：公路中线 → 发光路线 → 地图上的轨迹
  function drawTransitionLine(q) {
    const n = TRACK.length;
    if (n < 2) return;

    const a = smooth(0.00, 0.10, q) * (1 - smooth(0.74, 0.97, q));
    if (a <= 0.01) return;

    const grow = smooth(0.02, 0.26, q);          // 中线先“长”出来
    const m = smooth(0.12, 0.64, q);             // 再变形为地图轨迹
    const L = mapLayoutAt(1);

    // 起点：竖直中线（俯视时车底那条虚线的位置）
    const half = H * 0.56 * grow;
    const x0 = W / 2;

    const pts = [];
    for (let i = 0; i < n; i++) {
      const tI = i / (n - 1);
      const sy = H / 2 - half + 2 * half * tI;
      const tx = L.ox + ((TRACK[i].lng - MAP_LON0) / MAP_LON_SPAN) * L.w;
      const ty = L.oy + ((MAP_LAT0 - TRACK[i].lat) / MAP_LAT_SPAN) * L.h;
      pts.push([x0 + (tx - x0) * m, sy + (ty - sy) * m]);
    }

    const path = function () {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    };

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const layers = [[64, 0.09], [30, 0.16], [13, 0.30], [5.0, 0.56], [2.2, 0.95]];
    for (let i = 0; i < layers.length; i++) {
      path();
      ctx.lineWidth = layers[i][0] * (0.72 + 0.28 * m);
      ctx.strokeStyle = 'rgba(255, ' + Math.round(118 + i * 28) + ', ' +
                        Math.round(72 + i * 36) + ', ' + (layers[i][1] * a).toFixed(3) + ')';
      ctx.stroke();
    }

    // 两端各点一颗亮点
    for (let i = 0; i < 2; i++) {
      const e = pts[i === 0 ? 0 : n - 1];
      const R = H * 0.024 * (1 - 0.35 * m);
      const g = ctx.createRadialGradient(e[0], e[1], 0, e[0], e[1], R);
      g.addColorStop(0, 'rgba(255, 238, 218, ' + (0.5 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255, 120, 80, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(e[0], e[1], R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    const p = view.p;
    const p1 = Math.min(1, p);                  // 第一阶段：镜头升到车顶
    const q = Math.max(0, Math.min(1, p - 1));  // 第二阶段：继续升高 → 中国地图

    // 小车基准位置：从偏右 1/4 移到画面正中，同时作为镜头推近的焦点
    carBaseX = W * (0.75 - 0.25 * p1);
    carBaseY = H * (0.965 - 0.465 * p1);

    // 地平线（路面上沿）随镜头抬升而退出画面，前慢后快
    const roadTop = yMtn - (yMtn + H * 0.4) * Math.pow(p1, 1.5);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#070a19';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    // 地图：从中间那条线向上下展开（alpha 与展开范围都跟着转场走）
    if (q > 0.002) {
      // 先把深色底铺满，避免过渡时露出页面底色（也会被后处理染成怪色）
      ctx.fillStyle = '#06101C';
      ctx.fillRect(0, 0, W, H);

      const reveal = smooth(0.06, 0.86, q);
      drawMap(smooth(0.05, 0.42, q), 1, reveal);

      // 展开边缘用底色盖一道渐变，别出现硬切的“信箱边”
      if (reveal < 0.995) {
        const half = H * 1.32 * reveal / 2;
        const fy = Math.min(H * 0.11, half * 0.5);
        if (fy > 2) {
          const yT = H / 2 - half, yB = H / 2 + half;
          let gTop = ctx.createLinearGradient(0, yT - 2, 0, yT + fy);
          gTop.addColorStop(0, 'rgba(6,16,28,1)');
          gTop.addColorStop(1, 'rgba(6,16,28,0)');
          ctx.fillStyle = gTop;
          ctx.fillRect(0, yT - 2, W, fy + 2);

          let gBot = ctx.createLinearGradient(0, yB - fy, 0, yB + 2);
          gBot.addColorStop(0, 'rgba(11,27,43,0)');
          gBot.addColorStop(1, 'rgba(11,27,43,1)');
          ctx.fillStyle = gBot;
          ctx.fillRect(0, yB - fy, W, fy + 2);
        }
      }
    }

    // 地面 + 小车：第二阶段缩小并淡出
    const worldAlpha = 1 - smooth(0.02, 0.24, q);
    if (worldAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = worldAlpha;

      // 镜头推近（以小车为焦点），前慢后快；整体旋转 90°，把公路从横向转成纵向
      const zoom = (1 + 2.2 * p1 * p1) * (1 - 0.7 * q);
      ctx.translate(carBaseX, carBaseY);
      ctx.scale(zoom, zoom);
      ctx.rotate(-p1 * Math.PI / 2);
      ctx.translate(-carBaseX, -carBaseY);

      // 天空 / 云 / 山：跟着地平线一起上移，快出画时才淡出
      if (p1 < 0.98) {
        const fade = Math.max(0, 1 - Math.max(0, (p1 - 0.45) / 0.22));
        if (fade > 0.01) {
          ctx.save();
          ctx.globalAlpha = worldAlpha * fade;
          ctx.translate(0, roadTop - yMtn);
          drawSky();
          drawClouds();
          drawHills();
          ctx.restore();
        }
      }

      drawRoad(p1, roadTop);
      drawCar();
      ctx.restore();
    }

    // 中线收束成光带 → 变成地图轨迹
    if (q > 0.004) drawTransitionLine(q);

    const titleAlpha = Math.max(0, 1 - p * 2.6);
    if (titleAlpha > 0.01) drawTitle(titleAlpha);

    // 出片：统一色温 / 暗角 / 颗粒
    post();
  }

  let offsetX = 0;
  let offsetY = 0;

  function resize() {
    const box = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.max(1, Math.round(box.width * dpr));
    const ch = Math.max(1, Math.round(box.height * dpr));
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }
    // contain：完整装下 W×H（2:1），避免矮/高容器只露出局部
    const fit = Math.min(box.width / W, box.height / H);
    scale = fit * dpr;
    offsetX = (cw - W * scale) / 2;
    offsetY = (ch - H * scale) / 2;
    render();
  }

  function toDesign(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const px = (clientX - r.left) * (canvas.width / Math.max(1, r.width));
    const py = (clientY - r.top) * (canvas.height / Math.max(1, r.height));
    return {
      x: (px - offsetX) / Math.max(1e-6, scale),
      y: (py - offsetY) / Math.max(1e-6, scale)
    };
  }

  let prev = 0;
  function loop(now) {
    lastNow = now;
    if (!prev) prev = now;
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    // 系统开了“减少动画”时不冻结，只是放慢到 35%
    t += dt * (reduced ? 0.35 : 1);
    if (pulse > 0) pulse = Math.max(0, pulse - dt * 2.2);

    // 转场进度：按步骤缓入缓出，够慢才看得清
    if (anim) {
      const st = anim.steps[anim.i];
      const u = Math.max(0, Math.min(1, (now - anim.t0) / st.dur));
      const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      view.p = st.from + (st.to - st.from) * e;
      if (u >= 1) {
        view.p = st.to;
        const hold = st.hold || 0;
        anim.i++;
        anim.t0 = now + hold;
        if (anim.i >= anim.steps.length) anim = null;
      }
    }
    updateCamera();

    render();
    requestAnimationFrame(loop);
  }

  /* 双击小车：默认给个弹跳反馈；填上地址就顺便跳转 */
  const CAR_LINK = '';
  canvas.addEventListener('dblclick', function (e) {
    // 地图打开时，双击任意位置返回公路
    if (view.p > 1.2) {
      playSequence([{ to: 1, dur: 1500 }, { to: 0, dur: 2200 }]);
      return;
    }
    const p = toDesign(e.clientX, e.clientY);
    const x = p.x;
    const y = p.y;
    if (Math.abs(x - carX) <= carK * 1.02 &&
        y <= carY + H * 0.012 &&
        y >= carY - carK * 1.03) {
      pulse = 1;
      playSequence([{ to: 1, dur: 1700, hold: 350 }, { to: 2, dur: 2100 }]);
      if (CAR_LINK) window.open(CAR_LINK, '_blank');
    }
  });

  /* 地图：滚轮缩放（以鼠标为中心）+ 拖拽平移 */
  canvas.addEventListener('wheel', function (e) {
    if (view.p < 1.2) return;
    e.preventDefault();
    const p = toDesign(e.clientX, e.clientY);
    const mx = p.x;
    const my = p.y;
    const z0 = mapView.zoom;
    const z1 = Math.max(1, Math.min(6, z0 * Math.exp(-e.deltaY * 0.0016)));
    const cx = (mx - (mapView.x + W / 2)) / z0 + W / 2;
    const cy = (my - (mapView.y + H / 2)) / z0 + H / 2;
    mapView.zoom = z1;
    mapView.x = mx - W / 2 - (cx - W / 2) * z1;
    mapView.y = my - H / 2 - (cy - H / 2) * z1;
    const lim = (z1 - 1) * W * 0.5;
    mapView.x = Math.max(-lim, Math.min(lim, mapView.x));
    mapView.y = Math.max(-lim * 0.6, Math.min(lim * 0.6, mapView.y));
  }, { passive: false });

  let dragging = false, dragX = 0, dragY = 0;
  canvas.addEventListener('pointerdown', function (e) {
    if (view.p < 1.2) return;
    dragging = true; dragX = e.clientX; dragY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const dx = toDesign(e.clientX, e.clientY);
    const prevPt = toDesign(dragX, dragY);
    mapView.x += dx.x - prevPt.x;
    mapView.y += dx.y - prevPt.y;
    dragX = e.clientX; dragY = e.clientY;
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  document.addEventListener('visibilitychange', function () { prev = 0; });

  // iframe 嵌入时父布局后才有尺寸，单靠 window.resize 会漏
  const stageEl = canvas.parentElement;
  if (typeof ResizeObserver !== 'undefined' && stageEl) {
    let roScheduled = false;
    const ro = new ResizeObserver(function () {
      if (roScheduled) return;
      roScheduled = true;
      requestAnimationFrame(function () {
        roScheduled = false;
        resize();
      });
    });
    ro.observe(stageEl);
  }
  requestAnimationFrame(function () {
    resize();
    requestAnimationFrame(resize);
  });

  // 演示模式：?demo=1 模拟导航系统持续推送坐标
  if (/[?&]demo=1/.test(location.search)) {
    const route = [
      [121.47, 31.23], [120.36, 31.49], [119.97, 31.81], [118.80, 32.06],
      [117.20, 31.82], [114.30, 30.59], [113.63, 34.75], [116.40, 39.90]
    ];
    let seg = 0, f = 0;
    setTimeout(function () {
      window.carNav.clearTrack();
      window.carNav.open();
    }, 400);
    setInterval(function () {
      const a = route[seg], b = route[(seg + 1) % route.length];
      f += 0.10;
      if (f >= 1) { f = 0; seg = (seg + 1) % route.length; }
      window.carNav.setPosition(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
    }, 700);
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
